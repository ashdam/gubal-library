# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Release"

on:
  push:
    branches: ["main"]

concurrency:
  group: gubal-release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    needs: ["version"]
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/release-checks.yml
    permissions:
      contents: read

  version:
    name: "Check version"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Check version"
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/check-release.sh
      - name: "Check index credentials"
        if: steps.version.outputs.changed == 'true'
        env:
          HAS_MERGE_TOKEN: ${{ secrets.GUBAL_MERGE_TOKEN != '' }}
        run: |
          if [[ $HAS_MERGE_TOKEN != true ]]; then
            echo 'GUBAL_MERGE_TOKEN is required to publish the plugin index.' >&2
            exit 1
          fi
  publish-github-release:
    name: "Publish GitHub release"
    needs: ["version", "checks"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download plugin artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
          path: assets
      - name: "Download Desktop artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: assets
      - name: "Create the release tag"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG_NAME" -f "sha=$RELEASE_SHA"
      - name: "Publish"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            assets/latest.zip
            assets/*-Portable.zip
            assets/*-full.nupkg
            assets/releases.desktop-win.json
          generate_release_notes: true

  update-repo-json:
    name: "Prepare the plugin index"
    needs: ["version", "publish-github-release"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      base: ${{ steps.index.outputs.base }}
      head: ${{ steps.index.outputs.head }}
      blob: ${{ steps.index.outputs.blob }}
    steps:
      - name: "Checkout main"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: "Download plugin artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
          path: assets
      - name: "Rewrite and validate repo.json"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          source .github/scripts/check-release.sh
          jq -e --arg version "$RELEASE_VERSION" '.InternalName == "GubalLibrary" and .AssemblyVersion == $version' assets/GubalLibrary.json >/dev/null
          jq -e 'type == "array" and length == 1 and .[0].InternalName == "GubalLibrary"' repo.json >/dev/null
          version_gt "$RELEASE_VERSION" "$(jq -r '.[0].AssemblyVersion' repo.json)"
          jq --slurpfile manifest assets/GubalLibrary.json --argjson updated "$(date +%s)" '
            .[0] |= (.AssemblyVersion = $manifest[0].AssemblyVersion |
                     .DalamudApiLevel = $manifest[0].DalamudApiLevel |
                     .Name = $manifest[0].Name | .Punchline = $manifest[0].Punchline |
                     .Description = $manifest[0].Description | .LastUpdate = $updated)
          ' repo.json > "$RUNNER_TEMP/repo.json"
          jq -e 'type == "array" and length == 1 and .[0].InternalName == "GubalLibrary"' "$RUNNER_TEMP/repo.json" >/dev/null
          mv "$RUNNER_TEMP/repo.json" repo.json
      - name: "Commit the generated index"
        id: index
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          [[ $(git diff --cached --name-only) == repo.json ]]
          git commit -m "repo.json: $RELEASE_VERSION"
          head=$(git rev-parse HEAD)
          blob=$(git rev-parse HEAD:repo.json)
          git push origin "HEAD:refs/heads/repo-json/$RELEASE_VERSION"
          printf 'base=%s\nhead=%s\nblob=%s\n' "$base" "$head" "$blob" >> "$GITHUB_OUTPUT"

  merge-repo-json:
    name: "Merge the generated index"
    needs: ["version", "update-repo-json"]
    runs-on: ubuntu-latest
    permissions: {}
    # Keep the privileged token on a fresh runner without repository code.
    steps:
      - name: "Validate and merge the index pull request"
        env:
          GH_TOKEN: ${{ secrets.GUBAL_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          INDEX_BASE: ${{ needs.update-repo-json.outputs.base }}
          INDEX_HEAD: ${{ needs.update-repo-json.outputs.head }}
          INDEX_BLOB: ${{ needs.update-repo-json.outputs.blob }}
        run: |
          set -euo pipefail
          [[ -n $GH_TOKEN ]]
          for sha in "$INDEX_BASE" "$INDEX_HEAD" "$INDEX_BLOB"; do [[ $sha =~ ^[0-9a-f]{40}$ ]]; done
          [[ $RELEASE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh api "repos/$GH_REPO/commits/$INDEX_HEAD")
          jq -e --arg base "$INDEX_BASE" --arg blob "$INDEX_BLOB" '
            (.parents | length) == 1 and .parents[0].sha == $base and
            (.files | length) == 1 and .files[0].filename == "repo.json" and
            .files[0].status == "modified" and .files[0].sha == $blob
          ' <<< "$commit" >/dev/null
          [[ $(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha') == "$INDEX_BASE" ]]
          url=$(gh pr create --base main --head "repo-json/$RELEASE_VERSION" --title "Publish $RELEASE_VERSION in the plugin index" --body 'Update repo.json from the validated release manifest.')
          pr=$(gh pr view "$url" --json number,headRefOid,baseRefOid,baseRefName,isCrossRepository)
          jq -e --arg head "$INDEX_HEAD" --arg base "$INDEX_BASE" '
            .headRefOid == $head and .baseRefOid == $base and .baseRefName == "main" and .isCrossRepository == false
          ' <<< "$pr" >/dev/null
          gh api "repos/$GH_REPO/pulls/$(jq -r '.number' <<< "$pr")/files" --paginate --slurp |
            jq -e 'add | length == 1 and .[0].filename == "repo.json" and .[0].status == "modified"' >/dev/null
          gh pr merge "$url" --merge --admin --match-head-commit "$INDEX_HEAD"
