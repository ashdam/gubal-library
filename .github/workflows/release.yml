# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Release"

on:
  push:
    branches: ["main"]

concurrency:
  group: gubal-release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: "Check version"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Test version checks"
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: "Check version"
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B .github/scripts/check-release.py
      - name: "Check index credentials"
        if: steps.version.outputs.changed == 'true'
        env:
          HAS_MERGE_TOKEN: ${{ secrets.GUBAL_MERGE_TOKEN != '' }}
        run: |
          if [ "$HAS_MERGE_TOKEN" != "true" ]; then
            echo "GUBAL_MERGE_TOKEN is required to publish the plugin index." >&2
            exit 1
          fi

  build:
    name: "Build"
    needs: ["version"]
    if: needs.version.outputs.changed == 'true'
    runs-on: "windows-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up .NET"
        uses: "actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68" # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: "Fetch Dalamud"
        shell: "pwsh"
        run: |
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath "$env:RUNNER_TEMP\dalamud" -Force

      - name: "Build"
        shell: "pwsh"
        env:
          DALAMUD_HOME: "${{ runner.temp }}\\dalamud"
        run: dotnet build -c Release --nologo

      - name: "Check the version matches AssemblyVersion"
        shell: "pwsh"
        env:
          TAG_NAME: "${{ needs.version.outputs.tag }}"
        run: |
          $manifest = Get-Content 'bin\x64\Release\win-x64\GubalLibrary.json' -Raw | ConvertFrom-Json
          $tag = $env:TAG_NAME -replace '^v', ''
          if ($tag -ne $manifest.AssemblyVersion) {
            throw "Tag '$tag' does not match AssemblyVersion '$($manifest.AssemblyVersion)'. Bump <Version> in the csproj and retag."
          }

      - name: "Check the API level matches the released Dalamud"
        shell: "pwsh"
        run: |
          $manifest = Get-Content 'bin\x64\Release\win-x64\GubalLibrary.json' -Raw | ConvertFrom-Json

          $released = (Invoke-RestMethod 'https://goatcorp.github.io/dalamud-distrib/version').AssemblyVersion
          $level = [int] ($released -split '\.')[0]

          Write-Host "Built against API $($manifest.DalamudApiLevel); Dalamud $released ships API $level."
          if ($manifest.DalamudApiLevel -ne $level) {
            throw "API level $($manifest.DalamudApiLevel) does not match the released Dalamud's $level. Move the Dalamud.NET.Sdk pin and rebuild."
          }

      - name: "Upload artifact"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "plugin"
          path: |
            bin/x64/Release/win-x64/GubalLibrary/latest.zip
            bin/x64/Release/win-x64/GubalLibrary/GubalLibrary.json
          if-no-files-found: "error"
          retention-days: 1

  publish-github-release:
    name: "Publish GitHub release"
    needs: ["version", "build"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Download artifact"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "plugin"
          path: "assets"

      - name: "Create the release tag"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG_NAME" -f "sha=$RELEASE_SHA"

      - name: "Publish"
        uses: "softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64" # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "assets/latest.zip"
          generate_release_notes: true

  update-repo-json:
    name: "Prepare the plugin index"
    needs: ["version", "publish-github-release"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    outputs:
      base: ${{ steps.index.outputs.base }}
      head: ${{ steps.index.outputs.head }}
      blob: ${{ steps.index.outputs.blob }}
    steps:
      - name: "Checkout main"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "main"

      - name: "Download artifact"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "plugin"
          path: "assets"

      - name: "Rewrite and validate repo.json"
        shell: "pwsh"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $manifest = Get-Content 'assets/GubalLibrary.json' -Raw | ConvertFrom-Json
          if ($manifest.InternalName -ne 'GubalLibrary' -or $manifest.AssemblyVersion -ne $env:RELEASE_VERSION) {
            throw 'The manifest does not match this release.'
          }

          $entries = ConvertFrom-Json (Get-Content repo.json -Raw) -NoEnumerate
          if ($entries -isnot [System.Collections.IList] -or $entries.Count -ne 1 -or $entries[0].InternalName -ne 'GubalLibrary') {
            throw 'repo.json must contain one GubalLibrary entry.'
          }
          $entry = $entries[0]
          if ([version]$manifest.AssemblyVersion -le [version]$entry.AssemblyVersion) {
            throw 'The release version must exceed the version in repo.json.'
          }
          $entry.AssemblyVersion = $manifest.AssemblyVersion
          $entry.DalamudApiLevel = $manifest.DalamudApiLevel
          $entry.Name            = $manifest.Name
          $entry.Punchline       = $manifest.Punchline
          $entry.Description     = $manifest.Description
          $entry.LastUpdate      = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

          ConvertTo-Json $entry -Depth 10 -AsArray | Set-Content repo.json -Encoding utf8NoBOM

          $parsed = ConvertFrom-Json (Get-Content repo.json -Raw) -NoEnumerate
          if ($parsed -isnot [System.Collections.IList]) { throw 'repo.json is not a top-level array.' }
          foreach ($e in $parsed) {
            if ($e -is [System.Collections.IList]) { throw 'repo.json entries are arrays, not objects -- double-nested.' }
            if (-not $e.InternalName) { throw 'a repo.json entry has no InternalName.' }
          }
          Write-Host "repo.json validated: $($parsed.Count) entry(s), $($parsed[0].InternalName) $($parsed[0].AssemblyVersion)"

      - name: "Commit the generated index"
        id: index
        shell: "pwsh"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $base = git rev-parse HEAD
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          $files = @(git diff --cached --name-only)
          if ($files.Count -ne 1 -or $files[0] -ne 'repo.json') {
            throw 'Only repo.json may change.'
          }
          $version = $env:RELEASE_VERSION
          $branch = "repo-json/$version"
          git commit -m "repo.json: $version"
          $head = git rev-parse HEAD
          $blob = git rev-parse 'HEAD:repo.json'
          git push origin "HEAD:refs/heads/$branch"
          "base=$base" >> $env:GITHUB_OUTPUT
          "head=$head" >> $env:GITHUB_OUTPUT
          "blob=$blob" >> $env:GITHUB_OUTPUT

  merge-repo-json:
    name: "Merge the generated index"
    needs: ["version", "update-repo-json"]
    runs-on: "ubuntu-latest"
    permissions: {}
    # Keep the privileged token on a fresh runner with no checkout or downloaded code.
    steps:
      - name: "Validate and merge the index pull request"
        shell: "pwsh"
        env:
          GH_TOKEN: ${{ secrets.GUBAL_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          INDEX_BASE: ${{ needs.update-repo-json.outputs.base }}
          INDEX_HEAD: ${{ needs.update-repo-json.outputs.head }}
          INDEX_BLOB: ${{ needs.update-repo-json.outputs.blob }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:GH_TOKEN) { throw 'GUBAL_MERGE_TOKEN is required.' }
          foreach ($sha in @($env:INDEX_BASE, $env:INDEX_HEAD, $env:INDEX_BLOB)) {
            if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid index object ID.' }
          }
          $version = $env:RELEASE_VERSION
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release version.' }
          $branch = "repo-json/$version"
          $commit = gh api "repos/$env:GH_REPO/commits/$env:INDEX_HEAD" | ConvertFrom-Json
          if ($commit.parents.Count -ne 1 -or $commit.parents[0].sha -ne $env:INDEX_BASE) {
            throw 'The generated index must be one commit above its base.'
          }
          if ($commit.files.Count -ne 1 -or $commit.files[0].filename -ne 'repo.json' -or $commit.files[0].status -ne 'modified' -or $commit.files[0].sha -ne $env:INDEX_BLOB) {
            throw 'The remote commit does not match the generated index.'
          }
          $main = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($main -ne $env:INDEX_BASE) { throw 'main changed. Review the index before merging.' }
          $url = gh pr create --base main --head $branch --title "Publish $version in the plugin index" --body "Update repo.json from the validated release manifest."
          $pr = gh pr view $url --json number,headRefOid,baseRefOid,baseRefName,isCrossRepository | ConvertFrom-Json
          if ($pr.headRefOid -ne $env:INDEX_HEAD -or $pr.baseRefOid -ne $env:INDEX_BASE -or $pr.baseRefName -ne 'main' -or $pr.isCrossRepository) {
            throw 'The index pull request does not match the generated commit.'
          }
          $changed = @(gh api "repos/$env:GITHUB_REPOSITORY/pulls/$($pr.number)/files" --paginate | ConvertFrom-Json)
          if ($changed.Count -ne 1 -or $changed[0].filename -ne 'repo.json' -or $changed[0].status -ne 'modified') {
            throw 'The index pull request must only modify repo.json.'
          }
          gh pr merge $url --merge --admin --match-head-commit $env:INDEX_HEAD
