blank_issues_enabled: false
contact_links:
  - name: The plugin ships empty — where do I get a language pack?
    url: https://github.com/ashdam/gubal-library/blob/main/README.md#install
    about: >-
      Gubal Library distributes no translations. Installing it changes nothing until you load a pack
      somebody else built, or build your own. That is by design and is not a bug.
  - name: Building a language pack — how to translate a language
    url: https://eorzea-localized.ashdam.workers.dev/localize/en.html
    about: >-
      "It loaded but 0 entries" and "my own pack does not match anything" are almost always format
      questions. The localization site documents the format and the steps in full.
  - name: A line stayed in the original language
    url: https://github.com/ashdam/gubal-library/issues/new?template=untranslated_line.yml
    about: >-
      Usually a gap in the language pack rather than a fault in the plugin. Use this form — it asks
      for the misses.jsonl entry that tells the two apart.
